<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Enroll Now | Mawaddat-e-Fil-Qurba</title>

<link rel="stylesheet"
href="../css/style.css">

</head>


<body>


<div class="enroll-page">


    <div class="enroll-box">


        <h1>
            Mawaddat-e-Fil-Qurba
        </h1>


        <h2>
            Student Enrollment
        </h2>


        <p>
            Join our online learning platform
        </p>


        <form id="enrollForm">


            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >


            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="03XXXXXXXXX"
                required
            >


            <label>
                WhatsApp Number
            </label>

            <input
                type="tel"
                id="whatsapp"
                placeholder="03XXXXXXXXX"
                required
            >


            <label>
                Age
            </label>

            <input
                type="number"
                id="age"
                placeholder="Enter your age"
                required
            >


            <label>
                City
            </label>

            <input
                type="text"
                id="city"
                placeholder="Enter your city"
                required
            >


            <label>
                Select Course
            </label>

            <select id="course" required>

                <option value="">
                    Select Course
                </option>

                <option value="Maarifat-e-Masoomin">
                    Maarifat-e-Masoomin
                </option>

                <option value="Maarifat-e-Fiqh">
                    Maarifat-e-Fiqh
                </option>

                <option value="Maarifat-e-Aqeedah">
                    Maarifat-e-Aqeedah
                </option>

                <option value="Quran">
                    Quran
                </option>

                <option value="Tajweed">
                    Tajweed
                </option>

            </select>


            <button type="submit">
                Submit Enrollment
            </button>


        </form>


        <div id="enrollMessage"></div>


        <a href="../index.html">
            ← Back to Home
        </a>


    </div>

</div>


<script
type="module"
src="../js/enroll.js">
</script>


</body>

</html>
