<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login | Mawaddat-e-Fil-Qurba</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.login-box{
    max-width:420px;
    margin:80px auto;
    padding:35px;
    background:#ffffff;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.10);
    text-align:center;
}

.login-box h1{
    color:#173B3B;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
}

.login-box button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:none;
    border-radius:25px;
    background:#173B3B;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.login-box button:hover{
    background:#6B2020;
}

.forgot-password{
    display:block;
    margin-top:18px;
    color:#6B2020;
    cursor:pointer;
    font-size:14px;
    text-decoration:none;
}

.message{
    margin-top:15px;
    font-size:14px;
}

</style>

</head>


<body>

<div class="login-box">

<h1>
Admin Login
</h1>


<form id="loginForm">

<input
type="email"
id="email"
placeholder="Enter Admin Email"
required>


<input
type="password"
id="password"
placeholder="Enter Password"
required>


<button type="submit">
Login
</button>

</form>
<a href="#" id="forgotPassword" class="forgot-password">
    Forgot Password?
</a>

<p id="message" class="message"></p>

<script
    type="module"
    src="../js/admin-login.js">
</script>
