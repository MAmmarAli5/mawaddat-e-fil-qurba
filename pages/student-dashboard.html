<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Dashboard | Mawaddat-e-Fil-Qurba</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="dashboard-header">

    <div>
        <h1>Mawaddat-e-Fil-Qurba</h1>
        <p>Student Dashboard</p>
    </div>

    <button id="logoutBtn">
        Logout
    </button>

</header>


<main class="dashboard-container">

    <section class="welcome-card">

        <h2>
            Assalamu Alaikum,
            <span id="studentName">Student</span>
        </h2>

        <p>
            Welcome to your learning dashboard.
        </p>

    </section>


    <section class="student-info">

        <h2>Student Information</h2>

        <div class="info-grid">

            <div class="info-card">
                <span>Name</span>
                <strong id="infoName">Loading...</strong>
            </div>

            <div class="info-card">
                <span>Course</span>
                <strong id="infoCourse">Loading...</strong>
            </div>

            <div class="info-card">
                <span>Batch</span>
                <strong id="infoBatch">Loading...</strong>
            </div>

            <div class="info-card">
                <span>Status</span>
                <strong id="infoStatus">Loading...</strong>
            </div>

        </div>

    </section>


    <section class="course-dashboard">

        <h2 id="courseTitle">
            Your Course
        </h2>

        <p id="courseDescription">
            Your enrolled course material will appear here.
        </p>


        <div class="dashboard-actions">

            <button id="classesBtn">
                📚 Classes
            </button>

            <button id="booksBtn">
                📖 Course Book / PDF
            </button>

            <button id="examBtn">
                📝 Online Exam
            </button>

        </div>

    </section>


    <section class="latest-update">

        <h2>Latest Update</h2>

        <p id="latestUpdate">
            Loading latest updates...
        </p>

    </section>

</main>


<script type="module"
src="../js/student-dashboard.js">
</script>

</body>

</html>
