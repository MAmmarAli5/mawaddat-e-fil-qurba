<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Question</title>

<link rel="stylesheet" href="../css/admin.css">

</head>

<body>

<div class="container">

<h1>➕ Add New Question</h1>

<input
type="text"
id="question"
placeholder="Enter Question">

<input
type="text"
id="option1"
placeholder="Option 1">

<input
type="text"
id="option2"
placeholder="Option 2">

<input
type="text"
id="option3"
placeholder="Option 3">

<input
type="text"
id="option4"
placeholder="Option 4">

<input
type="number"
id="answer"
placeholder="Correct Answer Index (0-3)"
min="0"
max="3">

<button id="saveBtn">

Save Question

</button>

<br><br>

<a href="admin.html">

<button>

⬅ Back to Admin Panel

</button>

</a>

</div>

<script type="module" src="../js/add-question.js"></script>

</body>

</html>
