<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | Mawaddat-e-Fil-Qurba</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <h1>
            Mawaddat-e-Fil-Qurba
        </h1>

        <h2>
            Login
        </h2>

        <p>
            Login to continue your learning journey
        </p>


        <form id="loginForm">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p id="loginMessage"></p>


        <div class="login-links">

            <a href="../index.html">
                ← Back to Home
            </a>

        </div>

    </div>

</div>


<script type="module" src="../js/login.js"></script>

</body>

</html>
