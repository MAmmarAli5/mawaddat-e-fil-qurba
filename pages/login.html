<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="login-box">

<h1>Student Login</h1>

<p>Please enter your details to start the examination.</p>

<form action="exam.html">

<input
type="text"
placeholder="Student Full Name"
required>

<input
type="text"
placeholder="Roll Number (Optional)">

<select required>

<option value="">Select Batch</option>

<option>Batch 2026</option>

</select>

<select required>

<option value="">Select Course</option>

<option>معرفتِ معصومین</option>

<option>معرفتِ قرآن</option>

<option>معرفتِ عقیدہ</option>

<option>معرفتِ فقہ</option>

<option>معرفتِ احادیث</option>

<option>تفسیر القرآن</option>

</select>

<button onclick="startExam()">
Start Test
</button>

</form>

</div>
<script>
function startExam() {

    const name = document.getElementById("studentName").value.trim();
    const id = document.getElementById("studentId").value.trim();

    if (name === "" || id === "") {
        alert("براہ کرم Student Name اور Student ID درج کریں۔");
        return;
    }

    localStorage.setItem("studentName", name);
    localStorage.setItem("studentId", id);

    window.location.href = "exam.html";
}
</script>
</body>
</html>
