<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Mawaddat-e-Fil-Qurba</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f1e8;
            color: #173f35;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        .login-box h1 {
            color: #0F4C4C;
            margin-bottom: 8px;
        }

        .login-box p {
            color: #666;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 9px;
            background: #0F4C4C;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #176b5f;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .register-link {
            margin-top: 20px;
        }

        .register-link a {
            color: #0F4C4C;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-box">

        <h1>طالب علم لاگ اِن</h1>

        <p>
            Mawaddat-e-Fil-Qurba Online Learning Platform
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>

        <div id="message"></div>

        <div class="register-link">

            نئے طالب علم ہیں؟

            <a href="student-register.html">
                رجسٹریشن کریں
            </a>

        </div>

    </div>

</div>

<script type="module" src="../js/student-login.js"></script>

</body>

</html>
