<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login | Mawaddat-e-Fil-Qurba</title>

    <link rel="stylesheet"
          href="../css/auth.css">

</head>


<body>


<div class="auth-page">


    <div class="auth-card">


        <div class="auth-logo">

            <img src="../images/logo.png"
                 alt="Mawaddat-e-Fil-Qurba">

        </div>


        <h1>
            Student Login
        </h1>


        <p class="auth-subtitle">
            Mawaddat-e-Fil-Qurba Online Learning Platform
        </p>


        <form id="studentLoginForm">


            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit"
                    class="auth-btn">

                Login

            </button>


        </form>


        <div id="message"
             class="message">
        </div>


        <a href="#"
           id="forgotPassword"
           class="forgot">

            Forgot Password?

        </a>


        <div class="auth-divider">
            OR
        </div>


        <a href="student-register.html"
           class="register-btn">

            Create New Student Account

        </a>


        <a href="../index.html"
           class="back-home">

            ← Back to Home

        </a>


    </div>


</div>


<script type="module"
        src="../js/student-login.js">
</script>


</body>

</html>
