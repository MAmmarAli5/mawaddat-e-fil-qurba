<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login | Mawaddat-e-Fil-Qurba</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
                linear-gradient(
                    rgba(15,76,76,.90),
                    rgba(15,76,76,.90)
                ),
                url("images/banner.jpg");

            background-size:cover;
            background-position:center;
            padding:20px;
        }

        .student-login-box{

            width:100%;
            max-width:460px;

            background:#ffffff;

            padding:45px 35px;

            border-radius:22px;

            box-shadow:
                0 20px 50px rgba(0,0,0,.25);

            text-align:center;

            border-top:6px solid #D4AF37;

        }

        .student-login-box .icon{

            width:80px;
            height:80px;

            margin:0 auto 15px;

            border-radius:50%;

            background:#0F4C4C;

            color:#D4AF37;

            display:flex;

            align-items:center;
            justify-content:center;

            font-size:38px;

        }

        .student-login-box h1{

            color:#0F4C4C;

            font-size:32px;

            margin-bottom:8px;

        }

        .student-login-box h2{

            color:#6B1E1E;

            font-size:20px;

            margin-bottom:8px;

        }

        .student-login-box p{

            color:#777;

            margin-bottom:25px;

            font-size:15px;

        }

        .student-login-box input{

            width:100%;

            padding:15px;

            margin:10px 0;

            border:1px solid #ddd;

            border-radius:10px;

            font-size:16px;

            outline:none;

            transition:.3s;

        }

        .student-login-box input:focus{

            border-color:#0F4C4C;

            box-shadow:
                0 0 0 3px rgba(15,76,76,.08);

        }

        .student-login-box button{

            width:100%;

            padding:15px;

            margin-top:15px;

            background:#0F4C4C;

            color:white;

            border:none;

            border-radius:35px;

            font-size:17px;

            font-weight:600;

            cursor:pointer;

            transition:.3s;

        }

        .student-login-box button:hover{

            background:#6B1E1E;

            transform:translateY(-2px);

        }

        #loginMessage{

            margin-top:18px;

            font-size:14px;

            font-weight:600;

        }

        .back-home{

            display:inline-block;

            margin-top:20px;

            color:#0F4C4C;

            font-weight:600;

        }

        .back-home:hover{

            color:#6B1E1E;

        }

        @media(max-width:500px){

            .student-login-box{

                padding:35px 22px;

            }

            .student-login-box h1{

                font-size:27px;

            }

        }

    </style>

</head>


<body>


<div class="student-login-box">


    <div class="icon">
        🎓
    </div>


    <h1>
        Student Login
    </h1>


    <h2>
        Mawaddat-e-Fil-Qurba
    </h2>


    <p>
        Login to access your student dashboard
    </p>


    <form id="studentLoginForm">


        <input
            type="email"
            id="studentEmail"
            placeholder="Enter Email"
            required
        >


        <input
            type="password"
            id="studentPassword"
            placeholder="Enter Password"
            required
        >


        <button type="submit">

            Login to Dashboard

        </button>


    </form>


    <div id="loginMessage"></div>


    <a
        href="index.html"
        class="back-home"
    >

        ← Back to Home

    </a>


</div>


<script
    type="module"
    src="js/student-login.js">
</script>


</body>

</html>
