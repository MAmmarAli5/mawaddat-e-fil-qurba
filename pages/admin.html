<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Results</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="container">

    <h1>📊 Exam Results</h1>
<button id="logoutBtn">🚪 Logout</button>
    <div class="dashboard">

    <div class="card">
        <h3>Total Students</h3>
        <h2 id="totalStudents">0</h2>
    </div>

    <div class="card">
        <h3>Highest Marks</h3>
        <h2 id="highestMarks">0</h2>
    </div>

    <div class="card">
        <h3>Average %</h3>
        <h2 id="averageMarks">0%</h2>
    </div>

</div>
    <input
        type="text"
        id="search"
        placeholder="Search Student..."
    >
<div class="topper-box">

<h2>🏆 Top Position</h2>

<h3 id="topperName">-</h3>

<p id="topperMarks">-</p>

</div>
    <table>

        <thead>
            <tr>
                <th>Student Name</th>
                <th>Marks</th>
                <th>Percentage</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody id="resultsTable">

        </tbody>

    </table>

</div>

<script type="module" src="../js/admin.js"></script>

</body>
</html>
